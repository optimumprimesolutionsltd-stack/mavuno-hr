# Render Blueprint — Mavuno HR API
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions the API server + its Postgres database only.
# The frontend (artifacts/mavuno-hr) is a separate static site — not in this blueprint yet.
#
# First-time setup: see RENDER-DEPLOY.md for the secrets you must fill in and the
# go-live checklist. `sync: false` vars are left blank on purpose and must be set
# in the Render dashboard before the first deploy will boot cleanly.

services:
  - type: web
    name: mavuno-hr-api
    runtime: node
    region: frankfurt          # closest Render region to Kenya
    plan: starter              # always-on: needed for in-process schedulers + preDeployCommand
    branch: mavuno-hr
    autoDeploy: true
    # Installs deps, guarantees esbuild's native binary is present (it is
    # download-on-postinstall here — see the script), then bundles the API to
    # artifacts/api-server/dist/index.mjs.
    buildCommand: bash scripts/render-build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    # Sync the DB schema before the new version goes live. Safe (additive) on an
    # empty DB and for additive changes. Column renames can prompt — see RENDER-DEPLOY.md.
    preDeployCommand: pnpm --filter @workspace/db exec drizzle-kit push
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # --- Database (auto-wired from the managed Postgres below) ---
      - key: DATABASE_URL
        fromDatabase:
          name: mavuno-hr-db
          property: connectionString

      # --- Auth / session ---
      - key: SESSION_SECRET
        generateValue: true       # Render generates a random value; must be >= 32 chars (verify, regenerate if short)
      - key: SUPER_ADMIN_EMAILS
        value: optimumprimesolutionsltd@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false               # startup migration re-syncs the super-admin password from this on every boot

      # --- Clerk (Google identity bridge) — use LIVE keys, not test ---
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

      # --- Email: Resend (payslips + payment receipts) ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false               # e.g. "Mavuno HR <noreply@mavunohr.co.ke>" — domain must be verified in Resend

      # --- Email: Gmail SMTP (all other transactional mail) ---
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

      # --- M-Pesa STK Push billing ---
      - key: MPESA_ENV
        sync: false               # leave unset/"sandbox" until M-Pesa go-live is ready; set "production" to charge real money
      - key: MPESA_CALLBACK_IP_ALLOWLIST
        sync: false               # optional; comma-separated Safaricom callback IPs

databases:
  - name: mavuno-hr-db
    databaseName: mavuno_hr
    plan: basic-256mb             # smallest paid tier; size up as employee/payroll data grows
    region: frankfurt

<!DOCTYPE html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom must stay available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership, property https://mavunohr.co.ke/ on the
         optimumprimesolutionsltd@gmail.com account. Google re-checks this
         periodically, not just once, so removing it silently un-verifies the
         property and the sitemap and indexing reports go with it. There is a
         second, independent proof at public/google7ff24db1016f3869.html — it
         survives a rewrite of this file, which this tag would not. -->
    <meta name="google-site-verification" content="NZwu6KEPEl-ucJRmqqzyqtFDOiByOXo-OSxrs-tbzeo" />

    <!-- Bing Webmaster Tools ownership. Unlike Google's, this token is
         per-ACCOUNT rather than per-property — the same value verifies
         jamvi.co.ke, so a matching token across the two sites is correct, not a
         copy-paste error. Second, independent proof at public/BingSiteAuth.xml,
         which survives a rewrite of this file. -->
    <meta name="msvalidate.01" content="806462B0942A9438ACA1852D74949723" />

    <!-- Order matters. Browsers that understand SVG take it and stop; the rest
         fall back to the .ico. /favicon.ico also has to exist as a bare path
         regardless of what is declared here, because that is where Google's
         favicon fetcher and a lot of older clients look first. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#049756" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- seo:start — everything between these markers is REPLACED per route by
         prerender.mjs, using the meta in src/site-routes.ts. What is written
         here is the home page's block, and it is also the fallback that ships
         if the prerender step is ever skipped. Do not hand-edit per-page copy
         here; edit site-routes.ts. -->
    <title>Mavuno HR — Payroll &amp; HR Software for Kenya | PAYE, NSSF, SHIF</title>
    <meta name="description" content="Kenyan payroll and HR software. Automated PAYE, NSSF, SHIF and Housing Levy, P9 and P10 filing, employee self-service and bank and M-Pesa payment files." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://mavunohr.co.ke/" />
    <meta property="og:site_name" content="Mavuno HR" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:url" content="https://mavunohr.co.ke/" />
    <meta property="og:title" content="Mavuno HR — Payroll &amp; HR Software for Kenya" />
    <meta property="og:description" content="Automated PAYE, NSSF, SHIF and Housing Levy. Payslips, P9s and self-service, built for Kenyan businesses." />
    <meta property="og:image" content="https://mavunohr.co.ke/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mavuno HR — payroll, people and statutory compliance, built for Kenyan businesses." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mavuno HR — Payroll &amp; HR Software for Kenya" />
    <meta name="twitter:description" content="Automated PAYE, NSSF, SHIF and Housing Levy. Payslips, P9s and self-service, built for Kenyan businesses." />
    <meta name="twitter:image" content="https://mavunohr.co.ke/og-image.png" />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

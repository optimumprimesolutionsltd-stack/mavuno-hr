name: CI

# Until now the Render deploy was the first thing that ever ran a build of this
# repo, and nothing checked a branch before it merged. That is uncomfortable for
# any change, and unworkable for the marketing site specifically: pnpm-workspace
# .yaml excludes every rollup/esbuild/tailwind-oxide platform binary except
# linux-x64-gnu, so `vite build` cannot run on a Windows or macOS machine at all.
# Linux CI is the only place the build is reproducible outside production.
#
# Deliberately does NOT run `typecheck` on api-server: it reports 217
# pre-existing errors, all TS6305 from lib/db having no built dist. Adding it
# here would make CI red on arrival and train everyone to ignore it. Worth
# fixing separately, then adding.

on:
  pull_request:
  push:
    branches: [mavuno-hr]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck the marketing site
        run: pnpm --filter @workspace/mavuno-hr-website typecheck

      - name: Build the marketing site (client, SSR bundle, prerender)
        run: pnpm --filter @workspace/mavuno-hr-website build
        env:
          BASE_PATH: /

      - name: Every advertised route must be a real, distinct document
        run: |
          cd artifacts/mavuno-hr-website/dist/public
          pages="index features/index compliance/index paye-calculator/index pricing/index"

          # A route in the sitemap with no file behind it is a 404 we told
          # Google to go and fetch.
          for page in $pages; do
            test -s "$page.html" || { echo "missing $page.html"; exit 1; }
          done
          test -s sitemap.xml

          # The point of prerendering: each page ships its own content, not a
          # shared empty shell. If the slot survives, the render did nothing.
          ! grep -q 'app-html' index.html
          grep -q 'Run payroll with absolute confidence' index.html

          # ...and its own canonical. Five pages sharing one canonical is worse
          # than no canonical at all, and it is an easy regression to miss.
          files=$(for p in $pages; do printf '%s.html ' "$p"; done)
          canonicals=$(grep -ho 'rel="canonical" href="[^"]*"' $files | sort -u | wc -l)
          test "$canonicals" -eq 5 || { echo "expected 5 distinct canonicals, got $canonicals"; exit 1; }

          # FAQ markup is only legitimate where the questions are on the page,
          # so it belongs to the calculator and to nothing else.
          grep -q FAQPage paye-calculator/index.html || { echo "calculator lost its FAQPage"; exit 1; }
          if grep -l FAQPage index.html features/index.html compliance/index.html pricing/index.html; then
            echo "FAQPage on a page with no visible FAQ"; exit 1
          fi

          # The product has no Tally integration. Nothing on the site may say
          # otherwise, including the JSON-LD featureList.
          if grep -rilI tally .; then echo "Tally claim reintroduced"; exit 1; fi

          echo "marketing site OK"

      - name: Build the portal
        run: pnpm --filter @workspace/mavuno-hr build
        env:
          BASE_PATH: /app/
